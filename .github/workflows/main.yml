name: Build Solution

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'
    - name: Build solution

      run: |
          dotnet publish map1.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o windowsversion
          dotnet publish map1.csproj -c Release -r win-x64 --self-contained false /p:PublishSingleFile=false -o windowsversion2
          dotnet publish map1.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false -o windowsversion3
          


       
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
          name: artifact
          path: ${{ github.workspace }}/**/*
